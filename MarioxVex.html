<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Adventure Jump</title>
    <!-- Load Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Use a fun, pixel-style font for the game */
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #333;
            color: #FFF;
            overflow: hidden; /* Hide scrollbars */
        }
        
        /* Center the game container */
        .game-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
        }
        
        /* Style the canvas and the UI overlay */
        .game-wrapper {
            position: relative;
            width: 800px;
            height: 600px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        canvas {
            display: block;
            background-color: #87CEEB; /* Default sky blue */
            transition: background-color 0.3s ease;
        }
        
        /* General styling for UI elements */
        .ui-element {
            position: absolute;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 14px;
            text-shadow: 2px 2px #000;
        }

        /* Modal for messages (Level Complete, Game Over) */
        #messageModal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            z-index: 100;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }
        
        #messageModal button {
            font-family: 'Press Start 2P', cursive;
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 20px;
            transition: background-color 0.2s;
            border-bottom: 4px solid #388E3C;
        }
        
        #messageModal button:hover {
            background-color: #45a049;
        }

        #messageModal button.restart {
            background-color: #f44336;
            border-bottom: 4px solid #D32F2F;
        }
        #messageModal button.restart:hover {
            background-color: #e53935;
        }
    </style>
</head>
<body class="bg-gray-800">

    <div class="game-container">
        <div class="game-wrapper">
            <!-- The game canvas -->
            <canvas id="gameCanvas" width="800" height="600"></canvas>
            
            <!-- Heads-Up Display (HUD) -->
            <div id="hudLevel" class="ui-element top-3 left-3">Level: 1</div>
            <div id="hudLives" class="ui-element top-3 left-36">Lives: 3</div>
            <div id="hudScore" class="ui-element top-3 left-1/2 -translate-x-1/2">Score: 0</div>
            <div id="hudTime" class="ui-element top-3 right-3">Time: --</div>
            
            <!-- Message Modal -->
            <div id="messageModal" class="hidden">
                <h2 id="messageTitle" class="text-2xl mb-4">Level Complete!</h2>
                <p id="messageText" class="text-base">Your score: 100</p>
                <button id="modalButton">Next Level</button>
            </div>
        </div>
    </div>

    <script>
        // --- Setup & DOM Elements ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const hudLevel = document.getElementById('hudLevel');
        const hudScore = document.getElementById('hudScore');
        const hudTime = document.getElementById('hudTime');
        const hudLives = document.getElementById('hudLives');
        
        const messageModal = document.getElementById('messageModal');
        const messageTitle = document.getElementById('messageTitle');
        const messageText = document.getElementById('messageText');
        const modalButton = document.getElementById('modalButton');

        // --- Game State & Configuration ---
        let player;
        let platforms = [];
        let coins = [];
        let spikes = [];
        let portals = [];
        let gravityFlippers = [];
        let goal;
        
        let score = 0;
        let totalScore = 0; // Persistent score across levels
        let currentLevel = 0;
        let levelCoinCount = 0;
        let lives = 3;

        let gravity = 0.6;
        let gravityDirection = 1; // 1 = down, -1 = up
        let gameRunning = false;
        
        let timeLeft = 0;
        let timerInterval = null;

        const keys = {
            left: false,
            right: false,
            up: false,
            justPressedUp: false
        };

        // --- Level Data ---
        // A simple structure to define all levels
        const levels = [
            // Level 1: Introduction
            {
                startX: 50, startY: 500,
                startTime: 0, // 0 = no timer
                platforms: [
                    { x: 0, y: 580, w: 800, h: 20 }, // Ground
                    { x: 150, y: 500, w: 100, h: 20 },
                    { x: 300, y: 420, w: 100, h: 20 },
                    { x: 450, y: 340, w: 100, h: 20 },
                    { x: 600, y: 260, w: 150, h: 20 },
                ],
                coins: [
                    { x: 180, y: 470 }, { x: 330, y: 390 }, { x: 480, y: 310 }, { x: 700, y: 230 }
                ],
                spikes: [
                    { x: 400, y: 560, w: 100, h: 20 }
                ],
                goal: { x: 700, y: 200, w: 40, h: 40 }
            },
            // Level 2: Time Limit
            {
                startX: 50, startY: 500,
                startTime: 30, // 30 seconds
                platforms: [
                    { x: 0, y: 580, w: 150, h: 20 },
                    { x: 200, y: 540, w: 80, h: 20 },
                    { x: 320, y: 500, w: 80, h: 20 },
                    { x: 440, y: 460, w: 80, h: 20 },
                    { x: 560, y: 420, w: 80, h: 20 },
                    { x: 650, y: 380, w: 150, h: 20 },
                ],
                coins: [
                    { x: 230, y: 510 }, { x: 350, y: 470 }, { x: 470, y: 430 }, { x: 590, y: 390 }
                ],
                spikes: [
                    { x: 150, y: 560, w: 500, h: 20 }
                ],
                goal: { x: 750, y: 320, w: 40, h: 40 }
            },
            // Level 3: Gravity Flip
            {
                startX: 50, startY: 50,
                startTime: 0,
                platforms: [
                    { x: 0, y: 100, w: 200, h: 20 }, // Top start
                    { x: 0, y: 580, w: 800, h: 20 }, // Bottom floor
                    { x: 300, y: 450, w: 200, h: 20 },
                    { x: 200, y: 250, w: 200, h: 20 },
                    { x: 500, y: 100, w: 300, h: 20 },
                ],
                coins: [
                    { x: 100, y: 70 }, { x: 350, y: 420 }, { x: 250, y: 220 }, { x: 700, y: 70 }
                ],
                spikes: [
                    { x: 200, y: 100, w: 100, h: 20 }, // Top spikes
                    { x: 500, y: 560, w: 200, h: 20 }, // Bottom spikes
                ],
                gravityFlippers: [
                    { x: 150, y: 70, w: 30, h: 30 },
                    { x: 450, y: 420, w: 30, h: 30 },
                    { x: 250, y: 280, w: 30, h: 30 }
                ],
                goal: { x: 750, y: 40, w: 40, h: 40 }
            },
            // Level 4: Portals
            {
                startX: 50, startY: 500,
                startTime: 60,
                platforms: [
                    { x: 0, y: 580, w: 200, h: 20 }, // Start
                    { x: 0, y: 300, w: 200, h: 20 }, // Top left
                    { x: 300, y: 580, w: 200, h: 20 }, // Mid bottom
                    { x: 300, y: 300, w: 200, h: 20 }, // Mid top
                    { x: 600, y: 580, w: 200, h: 20 }, // End bottom
                    { x: 600, y: 300, w: 200, h: 20 }, // End top
                ],
                coins: [
                    { x: 100, y: 270 }, { x: 400, y: 270 }, { x: 700, y: 270 },
                ],
                spikes: [
                    { x: 200, y: 560, w: 100, h: 20 },
                    { x: 500, y: 560, w: 100, h: 20 },
                    { x: 200, y: 300, w: 100, h: 20 },
                    { x: 500, y: 300, w: 100, h: 20 },
                ],
                portals: [
                    // Pair 1
                    { x: 150, y: 520, w: 20, h: 40, target: 1, color: '#9370DB' }, // Purple In
                    { x: 150, y: 240, w: 20, h: 40, target: 0, color: '#00BCD4' }, // Cyan Out
                    // Pair 2
                    { x: 450, y: 240, w: 20, h: 40, target: 3, color: '#9370DB' },
                    { x: 450, y: 520, w: 20, h: 40, target: 2, color: '#00BCD4' },
                    // Pair 3
                    { x: 750, y: 240, w: 20, h: 40, target: 5, color: '#9370DB' },
                    { x: 750, y: 520, w: 20, h: 40, target: 4, color: '#00BCD4' },
                ],
                goal: { x: 380, y: 240, w: 40, h: 40 }
            }
        ];

        // --- Classes ---

        class Player {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 30;
                this.height = 30;
                this.vx = 0; // Velocity X
                this.vy = 0; // Velocity Y
                this.speed = 5;
                this.jumpPower = 12;
                this.onGround = false;
                this.teleportCooldown = 0;
            }

            draw() {
                // Draw a simple character
                ctx.fillStyle = '#FF6347'; // Tomato color
                ctx.fillRect(this.x, this.y, this.width, this.height);
                
                // Eyes
                ctx.fillStyle = 'white';
                ctx.fillRect(this.x + 6, this.y + 8, 5, 5);
                ctx.fillRect(this.x + 19, this.y + 8, 5, 5);
                ctx.fillStyle = 'black';
                ctx.fillRect(this.x + 8, this.y + 10, 2, 2);
                ctx.fillRect(this.x + 21, this.y + 10, 2, 2);
            }

            update() {
                // --- Handle Input ---
                if (keys.left) {
                    this.vx = -this.speed;
                } else if (keys.right) {
                    this.vx = this.speed;
                } else {
                    this.vx = 0;
                }
                
                // Jumping
                if (keys.justPressedUp && this.onGround) {
                    this.vy = -this.jumpPower * gravityDirection;
                    this.onGround = false;
                    keys.justPressedUp = false; // Consume the jump press
                }

                // --- Apply Physics ---
                this.vy += gravity * gravityDirection;
                
                this.x += this.vx;
                this.y += this.vy;
                
                this.onGround = false; // Assume not on ground until collision check

                // --- Collision Detection ---
                
                // Platforms
                for (const p of platforms) {
                    if (this.isColliding(p)) {
                        this.resolvePlatformCollision(p);
                    }
                }
                
                // Coins (iterate backwards to allow splicing)
                for (let i = coins.length - 1; i >= 0; i--) {
                    if (this.isColliding(coins[i])) {
                        coins.splice(i, 1);
                        score += 10;
                        updateHUD();
                    }
                }
                
                // Spikes
                for (const s of spikes) {
                    if (this.isColliding(s)) {
                        resetLevel("You hit a spike!");
                        return;
                    }
                }
                
                // Gravity Flippers
                for (let i = gravityFlippers.length - 1; i >= 0; i--) {
                    if (this.isColliding(gravityFlippers[i])) {
                        gravityFlippers.splice(i, 1);
                        gravityDirection *= -1; // Flip gravity!
                    }
                }
                
                // Portals
                if (this.teleportCooldown > 0) {
                    this.teleportCooldown--;
                } else {
                    for (const p of portals) {
                        if (this.isColliding(p)) {
                            const target = portals[p.target];
                            this.x = target.x;
                            this.y = target.y - (gravityDirection === 1 ? 0 : this.height);
                            this.vy = 0;
                            this.teleportCooldown = 30; // 30 frames cooldown
                            break; // Only one portal at a time
                        }
                    }
                }
                
                // Goal
                if (this.isColliding(goal)) {
                    levelComplete();
                    return;
                }

                // --- World Bounds & Pits ---
                if (this.x < 0) this.x = 0;
                if (this.x + this.width > canvas.width) this.x = canvas.width - this.width;
                
                // Check for falling out of the world
                if (this.y > canvas.height + 50 || this.y < -50) {
                    resetLevel("You fell out of the world!");
                    return;
                }
            }

            isColliding(obj) {
                return this.x < obj.x + (obj.w || obj.radius * 2) &&
                       this.x + this.width > obj.x &&
                       this.y < obj.y + (obj.h || obj.radius * 2) &&
                       this.y + this.height > obj.y;
            }
            
            resolvePlatformCollision(p) {
                // Find overlap on X and Y axes
                let overlapX = Math.min(this.x + this.width - p.x, p.x + p.w - this.x);
                let overlapY = Math.min(this.y + this.height - p.y, p.y + p.h - this.y);

                if (overlapY < overlapX) {
                    // Vertical collision
                    if (gravityDirection === 1) { // Normal Gravity
                        if (this.vy > 0) { // Moving down
                            this.y = p.y - this.height;
                            this.vy = 0;
                            this.onGround = true;
                        } else if (this.vy < 0) { // Moving up
                            this.y = p.y + p.h;
                            this.vy = 0;
                        }
                    } else { // Inverted Gravity
                         if (this.vy < 0) { // Moving up
                            this.y = p.y + p.h;
                            this.vy = 0;
                            this.onGround = true;
                        } else if (this.vy > 0) { // Moving down
                            this.y = p.y - this.height;
                            this.vy = 0;
                        }
                    }
                } else {
                    // Horizontal collision
                    if (this.vx > 0) { // Moving right
                        this.x = p.x - this.width;
                    } else if (this.vx < 0) { // Moving left
                        this.x = p.x + p.w;
                    }
                    this.vx = 0;
                }
            }
        }
        
        // --- Helper Drawing Functions ---
        
        function drawPlatforms() {
            ctx.fillStyle = '#4CAF50'; // Green
            for (const p of platforms) {
                ctx.fillRect(p.x, p.y, p.w, p.h);
            }
        }

        function drawCoins() {
            for (const c of coins) {
                ctx.beginPath();
                ctx.arc(c.x + 10, c.y + 10, 8, 0, Math.PI * 2);
                ctx.fillStyle = '#FFD700'; // Gold
                ctx.fill();
                ctx.closePath();
            }
        }

        function drawSpikes() {
            ctx.fillStyle = '#DC143C'; // Crimson
            for (const s of spikes) {
                for (let i = 0; i < s.w / 20; i++) {
                    ctx.beginPath();
                    // Check if spikes are on a "ceiling" (inverted)
                    const onCeiling = s.y < canvas.height / 2;
                    if (onCeiling || (s.y + s.h > 580 && gravityDirection === -1)) { // On ceiling or inverted on floor
                        ctx.moveTo(s.x + i * 20, s.y);
                        ctx.lineTo(s.x + (i * 20) + 10, s.y + s.h);
                        ctx.lineTo(s.x + (i * 20) + 20, s.y);
                    } else { // Normal floor spikes
                        ctx.moveTo(s.x + i * 20, s.y + s.h);
                        ctx.lineTo(s.x + (i * 20) + 10, s.y);
                        ctx.lineTo(s.x + (i * 20) + 20, s.y + s.h);
                    }
                    ctx.closePath();
                    ctx.fill();
                }
            }
        }
        
        function drawGravityFlippers() {
            ctx.fillStyle = '#FF9800'; // Orange
            for (const f of gravityFlippers) {
                ctx.fillRect(f.x, f.y, f.w, f.h);
                // Draw arrow
                ctx.fillStyle = 'white';
                ctx.beginPath();
                if (gravityDirection === -1) { // Inverted gravity, show DOWN arrow
                    ctx.moveTo(f.x + f.w / 2, f.y + f.h - 5);
                    ctx.lineTo(f.x + 5, f.y + 5);
                    ctx.lineTo(f.x + f.w - 5, f.y + 5);
                } else { // Normal gravity, show UP arrow
                    ctx.moveTo(f.x + f.w / 2, f.y + 5);
                    ctx.lineTo(f.x + 5, f.y + f.h - 5);
                    ctx.lineTo(f.x + f.w - 5, f.y + f.h - 5);
                }
                ctx.closePath();
                ctx.fill();
            }
        }

        function drawPortals() {
            for (const p of portals) {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.w, p.h);
                // Inner swirl
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.fillRect(p.x + 4, p.y + 4, p.w - 8, p.h - 8);
            }
        }
        
        function drawGoal() {
            ctx.fillStyle = '#2196F3'; // Blue
            ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
            // Checkered flag
            ctx.fillStyle = 'white';
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if ((i + j) % 2 === 0) {
                        ctx.fillRect(goal.x + i * (goal.w / 4), goal.y + j * (goal.h / 4), (goal.w / 4), (goal.h / 4));
                    }
                }
            }
        }

        // --- Game Loop ---
        
        function update() {
            if (!gameRunning) return;
            
            // Handle key states
            if (keys.up && !keys.justPressedUp && player.onGround) {
                keys.justPressedUp = true;
            }
            
            player.update();
        }

        function draw() {
            // Clear canvas with appropriate background
            if (gravityDirection === -1) {
                ctx.fillStyle = '#2c003e'; // Dark purple for inverted
                canvas.style.backgroundColor = '#2c003e';
            } else {
                ctx.fillStyle = '#87CEEB'; // Sky blue for normal
                canvas.style.backgroundColor = '#87CEEB';
            }
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw all game elements
            drawPlatforms();
            drawSpikes();
            drawCoins();
            drawGravityFlippers();
            drawPortals();
            drawGoal();
            
            player.draw();
        }

        function gameLoop() {
            if (!gameRunning) return;
            
            update();
            draw();
            
            requestAnimationFrame(gameLoop);
        }

        // --- Game State Management ---

        function updateHUD() {
            hudLevel.textContent = `Level: ${currentLevel + 1}`;
            hudScore.textContent = `Score: ${totalScore + score}`;
            hudLives.textContent = `Lives: ${lives}`;
            
            // Visual cues for low time/lives
            hudLives.style.color = lives === 1 ? 'red' : 'white';
            
            if (timeLeft > 0) {
                hudTime.textContent = `Time: ${timeLeft}`;
                hudTime.style.color = timeLeft <= 10 ? 'red' : 'white';
            } else if (levels[currentLevel].startTime > 0) {
                 hudTime.textContent = `Time: 0`;
                 hudTime.style.color = 'red';
            } else {
                hudTime.textContent = `Time: --`;
                hudTime.style.color = 'white';
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            const levelData = levels[currentLevel];
            
            if (levelData.startTime > 0) {
                timeLeft = levelData.startTime;
                timerInterval = setInterval(() => {
                    timeLeft--;
                    updateHUD();
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        if (gameRunning) {
                            resetLevel("Time's Up!");
                        }
                    }
                }, 1000);
            } else {
                timeLeft = 0;
            }
            updateHUD();
        }

        function showModal(title, text, buttonText, isRestart = false) {
            gameRunning = false;
            clearInterval(timerInterval);
            
            messageTitle.textContent = title;
            messageText.textContent = text;
            modalButton.textContent = buttonText;
            
            modalButton.className = isRestart ? 'restart' : '';
            
            if (isRestart) {
                modalButton.onclick = () => {
                    messageModal.classList.add('hidden');
                    // totalScore = 0; // Reset logic moved to loadLevel(0)
                    // lives = 3; // Reset logic moved to loadLevel(0)
                    loadLevel(0);
                };
            } else if (title.includes("Complete")) {
                modalButton.onclick = () => {
                    messageModal.classList.add('hidden');
                    loadLevel(currentLevel + 1);
                };
            }
            
            messageModal.classList.remove('hidden');
        }

        function levelComplete() {
            totalScore += score;
            totalScore += (timeLeft * 5); // Time bonus
            // Fix: Only award coin bonus if all coins are collected
            if (coins.length === 0) {
                totalScore += levelCoinCount * 20; // All coins bonus
            }
            
            if (currentLevel + 1 >= levels.length) {
                showModal("You Win!", `Final Score: ${totalScore}`, "Restart Game", true);
            } else {
                showModal("Level Complete!", `Score: ${totalScore}`, "Next Level");
            }
        }

        function resetLevel(reason) {
            gameRunning = false;
            lives--; // Decrement lives
            updateHUD(); // Update HUD to show new life count

            clearInterval(timerInterval);

            if (lives <= 0) {
                gameOver(reason); // Go to game over screen
                return;
            }
            
            // A brief "death" message
            ctx.fillStyle = 'rgba(255, 0, 0, 0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            ctx.font = '30px "Press Start 2P"';
            ctx.textAlign = 'center';
            ctx.fillText(reason, canvas.width / 2, canvas.height / 2);
            
            clearInterval(timerInterval);
            
            // Reload the level after 1.5 seconds
            setTimeout(() => {
                score = 0; // Reset level score
                loadLevel(currentLevel);
            }, 1500);
        }

        function gameOver(reason) {
            gameRunning = false;
            // Format reason text for modal
            const reasonText = `${reason}\nFinal Score: ${totalScore}`;
            showModal("Game Over", reasonText, "Restart Game", true);
        }

        function loadLevel(levelIndex) {
            if (levelIndex >= levels.length) {
                showModal("You Win!", `Final Score: ${totalScore}`, "Restart Game", true);
                return;
            }
            
            if (levelIndex === 0) {
                // Reset stats when starting the first level
                totalScore = 0;
                lives = 3;
            }
            
            currentLevel = levelIndex;
            const levelData = levels[currentLevel];

            // Clear old level data
            platforms = [];
            coins = [];
            spikes = [];
            portals = [];
            gravityFlippers = [];
            
            // Deep copy level data to prevent modifying the originals
            // Fix: Check if property exists before calling forEach
            if (levelData.platforms) {
                levelData.platforms.forEach(p => platforms.push({...p}));
            }
            if (levelData.coins) {
                levelData.coins.forEach(c => coins.push({...c, w: 20, h: 20, radius: 10}));
            }
            if (levelData.spikes) {
                levelData.spikes.forEach(s => spikes.push({...s}));
            }
            if (levelData.portals) {
                levelData.portals.forEach(p => portals.push({...p}));
            }
            if (levelData.gravityFlippers) {
                levelData.gravityFlippers.forEach(f => gravityFlippers.push({...f}));
            }
            goal = {...levelData.goal};
            
            levelCoinCount = coins.length;
            score = 0;
            gravityDirection = 1; // Reset gravity
            
            // Create player at start position
            player = new Player(levelData.startX, levelData.startY);
            
            startTimer();
            updateHUD();
            
            gameRunning = true;
            messageModal.classList.add('hidden');
            gameLoop();
        }

        // --- Event Listeners ---
        
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w') keys.up = true;
        });
        
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w') {
                keys.up = false;
                keys.justPressedUp = false; // Reset on key up
            }
        });

        // --- Start Game ---
        // Wait for all resources (like fonts) to load before starting
        window.onload = () => {
            loadLevel(0);
        };

    </script>
